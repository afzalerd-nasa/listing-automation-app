version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      - NODE_ENV=development
      - SP_API_MODE=SANDBOX
      - SP_API_MARKETPLACE_ID=A21TJRUUN4KGV
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: afzal_admin
      POSTGRES_PASSWORD: change_me_in_production
      POSTGRES_DB: afzal_listing_automation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
